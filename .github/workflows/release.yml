name: PR release

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create or update
        required: true

permissions:
  contents: write

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'development'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag || format('pr-{0}', github.event.pull_request.number) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Build zips
        run: |
          (cd Omlet_Datapack && zip -r ../omletsmp_datapack.zip pack.mcmeta data)
          (cd Omlet_ResourcePack && zip -r ../omletsmp_resourcepack.zip pack.mcmeta pack.png assets)

      - name: Create or update release
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --target main \
              --title "${{ github.event.pull_request.title || inputs.tag }}" \
              --notes "Built from ${{ github.event.pull_request.number && format('PR #{0}', github.event.pull_request.number) || github.ref_name }}"
          fi
          gh release upload "$TAG" omletsmp_datapack.zip omletsmp_resourcepack.zip --clobber
