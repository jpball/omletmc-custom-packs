name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TZ: UTC
    steps:
      - uses: actions/checkout@v4

      - name: Build zips
        run: |
          (cd Omlet_Datapack && zip -r ../omletsmp_datapack.zip pack.mcmeta data)
          (cd Omlet_ResourcePack && zip -r ../omletsmp_resourcepack.zip pack.mcmeta pack.png assets)

      - name: Set tag and title
        run: |
          echo "TAG=release-$(date +%F)" >> "$GITHUB_ENV"
          echo "TITLE=OmletSMP Packs v$(cat VERSION)" >> "$GITHUB_ENV"

      - name: Replace today's release
        run: |
          gh release delete "$TAG" --cleanup-tag --yes || true
          gh release create "$TAG" --target "$GITHUB_SHA" \
            --title "$TITLE" \
            --notes "Built from ${GITHUB_SHA::7}" \
            omletsmp_datapack.zip omletsmp_resourcepack.zip
